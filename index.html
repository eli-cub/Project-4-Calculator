<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="wrapper">
    <section class="calculator-screen" aria-label="Calculator display" aria-live="polite">0</section>
    <section class="calculator-buttons" aria-label="Calculator buttons">
      <button class="clear">C</button>
      <button aria-label="Backspace">&larr;</button>
      <button class="operator" aria-label="Divide">&divide;</button>
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="operator" aria-label="Multiply">&times;</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="operator" aria-label="Subtract">-</button>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="operator" aria-label="Add">+</button>
      <button class="zero">0</button>
      <button class="operator" aria-label="Equals">=</button>
    </section>
  </div>
</body>
</html>
